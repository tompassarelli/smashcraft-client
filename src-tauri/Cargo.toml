[package]
name = "smashcraft-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false
license = "MIT"
description = "Smashcraft: controller, play, history, stats, replays and online"

[lib]
name = "smashcraft_client"
path = "src/lib.rs"

[[bin]]
name = "smashcraft"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
flate2 = "1"
padbridge-model = { git = "https://github.com/tompassarelli/padbridge", tag = "v0.4.0" }
sha1 = "0.10"
crc32fast = "1"
relay-agent = { git = "https://github.com/tompassarelli/wisp", rev = "09832b76e5c46eccccf8ff324b3451ab20f44d1b" }
relay-proto = { git = "https://github.com/tompassarelli/wisp", rev = "09832b76e5c46eccccf8ff324b3451ab20f44d1b" }
smashcraft-servers = { path = "servers", optional = true }

[dev-dependencies]
relay = { git = "https://github.com/tompassarelli/wisp", rev = "09832b76e5c46eccccf8ff324b3451ab20f44d1b" }

[features]
smashcraft-servers = ["dep:smashcraft-servers"]

[profile.release]
codegen-units = 16
lto = false
