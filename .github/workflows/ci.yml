name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.paths.outputs.ui }}
      rust: ${{ steps.paths.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=""
          if [ "$EVENT" = pull_request ]; then base=$BASE
          elif [ "$EVENT" = push ] && [ "${REF#refs/tags/}" = "$REF" ] && ! [[ "$BEFORE" =~ ^0+$ ]]; then base=$BEFORE
          fi
          if [ -z "$base" ] || ! files=$(git diff --name-only "$base" "$GITHUB_SHA"); then
            echo "ui=true" >> "$GITHUB_OUTPUT"; echo "rust=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s\n' "$files"
          match() { grep -qE "$1" <<<"$files" && echo true || echo false; }
          echo "ui=$(match '^(ui/|scripts/|smashcraft\.ref$|\.github/)')" >> "$GITHUB_OUTPUT"
          echo "rust=$(match '^(src-tauri/|smashcraft\.ref$|\.github/)')" >> "$GITHUB_OUTPUT"

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Smashcraft client kit (smashcraft.ref)
        run: bun scripts/kit.ts
      - name: Pages
        working-directory: ui
        run: bun install --frozen-lockfile && bun test && bun test ../scripts && bun run check && bun run build

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: smashcraft-client-linux-x86_64
            service: wc3-controller-linux-x86_64.tar.gz
          - os: windows-latest
            asset: smashcraft-client-windows-x86_64
            service: wc3-controller-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Linux window and tray libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Smashcraft client kit (smashcraft.ref)
        run: bun scripts/kit.ts
      - name: Pages for the window
        working-directory: ui
        run: bun install --frozen-lockfile && bun run build
      - name: Pinned Rust toolchain
        working-directory: src-tauri
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Release build
        working-directory: src-tauri
        run: cargo build --locked --release
      # The controller service at the tag the model crate is pinned to.
      - name: Package with the controller service
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(sed -n 's/^wc3-controller-model = .*tag = "\([^"]*\)".*/\1/p' src-tauri/Cargo.toml)
          test -n "$tag"
          mkdir -p service dist/${{ matrix.asset }}
          gh release download "$tag" -R tompassarelli/wc3-controller -p "${{ matrix.service }}" -D service
          cd service
          if [ "$RUNNER_OS" = Windows ]; then 7z x -bd ${{ matrix.service }} >/dev/null; else tar xzf ${{ matrix.service }}; fi
          cd ..
          cp service/wc3-controller-*/wc3-controller* dist/${{ matrix.asset }}/
          cp src-tauri/target/release/smashcraft${{ runner.os == 'Windows' && '.exe' || '' }} src-tauri/icons/icon.png LICENSE README.md dist/${{ matrix.asset }}/
          echo "smashcraft-client ${GITHUB_SHA::12}, wc3-controller $tag, Smashcraft $(cat smashcraft.ref | cut -c1-12) (kit version $(sed -n 's/.*"version": "\(.*\)".*/\1/p' ui/kit/kit.json))" > dist/${{ matrix.asset }}/VERSION
          cd dist && if [ "$RUNNER_OS" = Windows ]; then 7z a -bd ${{ matrix.asset }}.zip ${{ matrix.asset }} >/dev/null; else tar czf ${{ matrix.asset }}.tar.gz ${{ matrix.asset }}; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.*
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Linux and Windows builds of the Smashcraft client $GITHUB_REF_NAME, with the wc3-controller service." || true
          gh release upload "$GITHUB_REF_NAME" dist/${{ matrix.asset }}.* --clobber

  ci:
    needs: [changes, ui, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do case $result in success|skipped) ;; *) exit 1 ;; esac; done
